name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check, build, typecheck, and test
        run: npm test
      - name: Verify generated package entrypoints
        run: test -f dist/index.js && test -f dist/index.d.ts
      - name: Install tested revision through Pi's HTTPS Git flow
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PI_CODING_AGENT_SESSION_DIR: ${{ runner.temp }}/pi-sessions
          PI_OFFLINE: "1"
          GIT_TERMINAL_PROMPT: "0"
          INSTALL_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$PI_CODING_AGENT_DIR" "$PI_CODING_AGENT_SESSION_DIR"
          package_source="https://github.com/${INSTALL_REPOSITORY}.git@${INSTALL_REF}"
          install_dir="$PI_CODING_AGENT_DIR/git/github.com/$INSTALL_REPOSITORY"

          ./node_modules/.bin/pi install "$package_source"
          ./node_modules/.bin/pi list

          grep -Fq "$package_source" "$PI_CODING_AGENT_DIR/settings.json"
          test "$(git -C "$install_dir" rev-parse HEAD)" = "$INSTALL_REF"
          test -f "$install_dir/node_modules/acorn/package.json"
